# Guards de PR — barram os dois modos de falha que atravessaram TODA a cadeia de
# validação em verde na rodada 3 (issue #162).
#
# Deliberadamente LEVE: não roda `pnpm install`, build nem a suíte completa. O
# `@urbiverso/sdk` é privado (GitHub Packages, org urbiverso) e o GITHUB_TOKEN efêmero
# deste repo não tem read:packages cross-org → o install falha com 401 (ver release.yml,
# que precisa do PAT em secrets.URBIVERSO_PACKAGES_TOKEN). Estes guards são só git + grep,
# então rodam sem credencial nenhuma e nunca ficam vermelhos por falta de acesso.
#
# ⚠️ Todo job tem `timeout-minutes` (aqui 5; o baseline destes guards é 6–13 SEGUNDOS).
# Sem ele o default do GitHub é 6 horas — ver o cabeçalho do `validation.yml`, escrito
# depois do travamento da PR #304 em 2026-08-06.
name: pr-guards
on:
  pull_request:
    # `edited` importa: o corpo do PR é metade da entrada do guard de diff vazio,
    # então editar a descrição precisa re-rodar a checagem.
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  diff-vazio:
    name: PR que fecha issue precisa alterar arquivo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # precisa do histórico para o merge-base do diff
      - name: Verificar diff vs. issues fechadas
        env:
          # Corpo e títulos vêm de entrada de usuário — passam por env, NUNCA
          # interpolados direto no script (script injection).
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Diff de merge-base (três pontos): só o que o PR realmente introduz,
          # ignorando o que a base andou para frente.
          arquivos="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          n_arquivos="$(printf '%s' "$arquivos" | grep -c . || true)"

          # Mensagens dos commits do PR entram junto: o GitHub fecha issue tanto pelo
          # corpo do PR quanto por commit message. O #142 trazia os Closes na mensagem.
          commits="$(git log --format='%B' "$BASE_SHA..$HEAD_SHA" || true)"
          texto="$PR_TITULO
          $PR_BODY
          $commits"

          # Palavras-chave que o GitHub realmente aceita para auto-fechar issue.
          padrao='(clos(e|es|ed)|fix(|es|ed)|resolv(e|es|ed))[[:space:]]*:?[[:space:]]*#[0-9]+'
          if printf '%s' "$texto" | grep -qiE "$padrao"; then
            fecha_issue=1
            citadas="$(printf '%s' "$texto" | grep -oiE "$padrao" | tr '\n' ' ')"
          else
            fecha_issue=0
            citadas=''
          fi

          echo "arquivos alterados: $n_arquivos"
          echo "fecha issue: $fecha_issue $citadas"

          if [ "$n_arquivos" -eq 0 ] && [ "$fecha_issue" -eq 1 ]; then
            echo "::error title=PR fecha issue sem alterar arquivo::Este PR declara fechar issue ($citadas) mas o diff contra a base está VAZIO — zero arquivos alterados. Foi exatamente assim que o PR #142 fechou 12 issues sem entregar nada (ver #162). Revise antes de mergear."
            exit 1
          fi

          if [ "$n_arquivos" -eq 0 ]; then
            echo "::warning title=PR sem alterações::O diff contra a base está vazio. Não fecha issue, então não é bloqueante — mas confirme que é intencional."
          fi

          echo "ok: $n_arquivos arquivo(s) alterado(s)."

  aspas-curvas:
    name: Aspas curvas em posição de atributo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard de aspas curvas
        run: |
          set -uo pipefail
          # Mesmo guard da etapa 1/5 de scripts/validar-frontend.sh, replicado aqui para
          # pegar quem não rodou o script local. Aspas curvas em posição de ATRIBUTO
          # deixam o atributo inerte e passam batido por typecheck/testes/build.
          # Alternância (e não a classe [”“]) porque sem locale UTF-8 o grep compara
          # byte a byte e ”/“/—/→ dividem o primeiro byte 0xE2 → falso positivo.
          if grep -rn '=\(”\|“\|‘\|’\)' frontend/; then
            echo "::error title=Aspas curvas em atributo::As linhas acima usam aspas curvas em posição de atributo. O parser inclui as aspas no valor, o atributo fica INERTE e nada falha no typecheck/teste/build (ver #160). Use aspas retas."
            exit 1
          fi
          echo "ok: nenhuma aspa curva em posição de atributo."

  issue-fechamento:
    name: PR que cita issue declara se fecha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # precisa do histórico para ler as mensagens dos commits do PR
      - name: Guard de fechamento de issue
        env:
          # Corpo do PR é entrada de usuário — via env, NUNCA interpolado no script.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # As mensagens dos commits do PR entram junto com o corpo: o GitHub fecha
          # issue pelos dois. Foi na mensagem de commit que as 53 issues das Rodadas
          # 5 e 6 foram citadas — sempre como menção `(#NNN)`, nunca com keyword.
          PR_COMMITS="$(git log --format='%B' "$BASE_SHA..$HEAD_SHA" || true)" \
            node scripts/guard-issue-fechamento.mjs || {
              echo "::error title=Issue citada sem declarar fechamento::O PR cita issue(s) sem keyword de fechamento e sem declarar 'Sem-fechamento:'. Só closes/fixes/resolves fecham, no corpo do PR ou no commit — nunca no título, nunca em intervalo (#273-276). Foi assim que 53 issues implementadas ficaram abertas."
              exit 1
            }

  json-estrito:
    name: schema.json e manifesto.json são JSON estrito
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard de JSON estrito
        run: |
          set -uo pipefail
          # Só `node` (já vem no runner) — sem pnpm install, sem SDK, sem credencial.
          # Comentário `//` no schema.json passa por typecheck, testes, build e pelo
          # harness de migrações em VERDE, e só falha na instalação, com "Pacote
          # reprovado na validacao" (foi a v0.1.19). Ver scripts/guard-json.mjs.
          if ! node scripts/guard-json.mjs; then
            echo "::error title=JSON inválido::schema.json ou manifesto.json não é JSON estrito. O shell reprova o pacote na instalação com 'Pacote reprovado na validacao' antes de olhar qualquer tabela. Comentário // não existe em JSON."
            exit 1
          fi

  schema-ciclos:
    name: schema.json não tem ciclo de FK entre tabelas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard de ciclos no schema
        run: |
          set -uo pipefail
          # Só `node` — sem pnpm install, sem SDK, sem credencial.
          # A FK nasce INLINE no CREATE TABLE do sincronizador: num ciclo não existe
          # ordem de criação que satisfaça as duas pontas, e a instalação numa
          # instância VIRGEM reprova com `[dry_run_schema] relation ... does not exist`.
          # Instância que já tem a app não acusa (as colunas chegaram por ALTER TABLE),
          # então typecheck, testes, esbuild e o harness de migrações ficam todos
          # verdes. Ver scripts/guard-schema-ciclos.mjs.
          if ! node scripts/guard-schema-ciclos.mjs; then
            echo "::error title=Ciclo no schema.json::Ciclo de dependência entre tabelas. A instalação numa instância virgem (homolog/prod nova) reprova no dry-run com 'relation \"<app>.<tabela>\" does not exist'. Instância que já tem a app não acusa."
            exit 1
          fi

  escopo-processo:
    name: PR de processo não mistura código de produto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Guard de escopo (regra R1)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Só `git` + `node` — sem pnpm install, sem SDK, sem credencial.
          # Diff de TRÊS PONTOS: dois pontos compara as pontas e acusa arquivo que
          # veio da main no meio, produzindo falso positivo em PR desatualizado.
          #
          # --no-renames NÃO é enfeite: com detecção de rename ligada (o default),
          # mover `.claude/regra.md` para fora da árvore emite SÓ o caminho de
          # destino. O script não veria arquivo de processo nenhum e aprovaria a
          # mistura — reproduzido pelo Codex no PR 496, exit 0. Sem a detecção, a
          # origem removida também aparece e é classificada.
          ARQUIVOS="$(git diff --no-renames --name-only "$BASE_SHA"..."$HEAD_SHA")"
          export PR_ARQUIVOS="$ARQUIVOS"
          if ! node scripts/guard-pr-escopo-processo.mjs; then
            echo "::error title=Escopo do PR::Arquivo de .claude/ junto com codigo de produto. Regra R1 do CLAUDE.md: o PR de processo sai sozinho, com todos os documentos propagados no mesmo diff. Editar processo dentro de um PR em revisao produz um ciclo que nao converge."
            exit 1
          fi

  migracao-declarativa:
    name: Migração não declara estrutura no retorno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard de retorno declarativo em migração
        run: |
          set -uo pipefail
          # `remover_colunas`/`remover_tabelas` no retorno de uma migração é migração
          # DECLARANDO estrutura — o oposto do que o schema.json garante. Obsoleto na
          # plataforma desde 2026-08-08 e GATE a partir de 2026-08-23: passada a data,
          # a app é reprovada na instalação. O caminho é tirar a coluna/tabela do
          # schema.json e esvaziá-la com dados.limparColuna/limparTabela — a poda do
          # reconciliador derruba a estrutura vazia no mesmo boot. Ver issue #422.
          #
          # Aqui em vez de no validar-backend.sh porque este CI não precisa do token
          # do SDK e roda em todo PR. A etapa 5 do harness de migrações cobre o mesmo
          # caso executando a migração — as duas defesas são complementares.
          # Linha de COMENTÁRIO fica de fora: a própria 003 explica no cabeçalho por
          # que o retorno declarativo saiu de lá, e um guard que reprovasse a
          # explicação obrigaria a apagar a memória do conserto.
          achados="$(grep -rnE 'remover_(colunas|tabelas)' migracoes/ | grep -vE '^[^:]+:[0-9]+: *(//|\*)' || true)"
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error title=Retorno declarativo em migração::As linhas acima usam remover_colunas/remover_tabelas fora de comentário. Isso é migração declarando estrutura — obsoleto desde 2026-08-08 e GATE a partir de 2026-08-23, quando a app passa a ser REPROVADA na instalação. Remova a coluna/tabela do schema.json e esvazie com dados.limparColuna/limparTabela (ver #422)."
            exit 1
          fi
          echo "ok: nenhuma migração declara estrutura no retorno."

  processo-integro:
    name: A rede do processo obrigatório está de pé
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard da rede do processo
        run: |
          set -uo pipefail
          # Hooks, permissions.deny e a skill de revisão falham TODOS em silêncio:
          # um PR que apague o settings.json, renomeie um script de hook ou perca o
          # bit de execução não deixa nada vermelho — os hooks só param de rodar, e
          # "não rodou" é indistinguível de "tudo normal". Este job é o que torna a
          # ausência visível. Ver CLAUDE.md § Processo obrigatório de trabalho.
          if ! node scripts/guard-processo.mjs; then
            echo "::error title=Rede do processo furada::Um arquivo que sustenta o processo obrigatório sumiu, não parseia ou perdeu o bit de execução. Nada mais fica vermelho por causa disso — por isso este guard existe."
            exit 1
          fi
      - name: Bateria da guarda do monorepo
        if: always()
        run: |
          set -uo pipefail
          # Falso NEGATIVO deixa a escrita no monorepo passar; falso POSITIVO
          # atrapalha trabalho legítimo, alguém desliga o hook, e aí ele não guarda
          # mais nada. Os dois casos precisam de teste — já houve um falso positivo
          # que bloqueava `pull_request_read`, isto é, quebrava a própria revisão.
          if ! bash scripts/testar-guarda-monorepo.sh; then
            echo "::error title=Guarda do monorepo falhou::A guarda que impede escrita em urbiverso/urbiverso não se comporta como o esperado. Veja quais casos falharam no log."
            exit 1
          fi
      - name: Bateria do parsing do revisao-registrada
        if: always()
        run: |
          set -uo pipefail
          # O job `revisao-registrada` não fica vermelho quando o parsing quebra:
          # ele reprova um PR revisado com "nenhuma revisão registrada", que parece
          # veredito legítimo. Já aconteceu (`gh api --jq --arg`, head 310156e).
          if ! bash scripts/testar-revisao-registrada.sh; then
            echo "::error title=Parsing da atestação de revisão falhou::A extração da linha de máquina não se comporta como o esperado — o status revisao/bloqueantes reprovaria PR revisado."
            exit 1
          fi

  guards-ui:
    name: Tokens, props de primitivo e box model do urbi-*
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URBI_TYPESCRIPT: ${{ github.workspace }}/.ts-guards/node_modules/typescript/lib/typescript.js
    steps:
      - uses: actions/checkout@v7
      - name: Instalar só o typescript, isolado
        run: |
          set -uo pipefail
          # Desde a 3ª rodada de revisão do PR 505 o lexer de JS/TS dos guards é o
          # PARSER do `typescript` — três rodadas seguidas acharam classe nova num
          # lexer artesanal, e a saída foi parar de escrever um.
          #
          # ⚠️ O install é num diretório PRÓPRIO, com package.json próprio, e nunca
          # na raiz: `npm install` na raiz leria o package.json do repo e tentaria
          # baixar o `@urbiverso/sdk`, que é GitHub Packages privado — 401, e este
          # workflow existe justamente para nunca depender de credencial. O
          # `typescript` é público, então este passo não reintroduz esse problema.
          mkdir -p .ts-guards
          cd .ts-guards
          echo '{"name":"ts-guards","private":true}' > package.json
          npm install --no-audit --no-fund --loglevel=error typescript@5.9.3
          node -e "console.log('typescript', require('./node_modules/typescript').version)"
      - name: Guards de UI contra o espelho docs/ui-urbiverso/
        run: |
          set -uo pipefail
          # Os três leem `docs/ui-urbiverso/`, que é conteúdo DESTE repositório (o
          # espelho versionado da referência do urbiverso). Sem SDK, sem
          # credencial. Faltando o `typescript`, eles RECUSAM analisar em vez de
          # aprovar — "não deu para rodar" nunca é "passou".
          #
          # As três classes que eles pegam são falhas 100% SILENCIOSAS — atravessam
          # typecheck, testes e esbuild em verde, exatamente como as aspas curvas:
          #   · `var(--nao-existe, #hex)` → o fallback vira a cor efetiva, para
          #     sempre, e não acompanha nenhum dos quatro temas do shell (#475);
          #   · atributo que o primitivo não declara → não faz nada, a prop fica
          #     no default;
          #   · `width` de fora num urbi-* sem `box-sizing: border-box` → a caixa
          #     renderizada mede width + padding + border e pinta sobre o vizinho.
          #     Reportado quatro vezes (#176, #262, #326, #352) e fechado quatro.
          falhou=0
          node scripts/guard-tokens-css.mjs || falhou=1
          node scripts/guard-props-urbi.mjs || falhou=1
          node scripts/guard-box-model-urbi.mjs || falhou=1
          if [ "$falhou" != "0" ]; then
            echo "::error title=Guard de UI reprovou::Token inexistente, atributo que o primitivo não declara, ou width/height de fora num urbi-* sem box-sizing. Nenhuma das três aparece no typecheck, nos testes ou no build — veja o log acima para o arquivo:linha."
            exit 1
          fi
      - name: Bateria do lexer compartilhado
        if: always()
        run: |
          set -uo pipefail
          # `scripts/lib/fonte-ts.mjs` e o unico lugar onde os tres guards decidem
          # fronteira de comentario, string, template e `${…}`. Essa e a vantagem —
          # um lugar para consertar — e o risco: um erro ali erra nos tres de uma
          # vez, e em silencio. JS/TS quem resolve e o parser do TypeScript; o que
          # a bateria cobre e a camada CSS/HTML, escrita a mao, e o modo de falha
          # invertido.
          if ! bash scripts/testar-fonte-ts.sh; then
            echo "::error title=Bateria do lexer falhou::scripts/lib/fonte-ts.mjs nao delimita comentario, string ou template como o esperado. Os tres guards de UI dependem dele."
            exit 1
          fi
      - name: Bateria dos guards de UI
        if: always()
        run: |
          set -uo pipefail
          # Guard falha calado nos DOIS sentidos, e a bateria cobre os dois: falso
          # negativo deixa o defeito passar (guard vira teatro); falso positivo
          # reprova código correto, alguém desliga o guard, e aí ele não guarda
          # mais nada. A construção do espelho já produziu falso positivo duas
          # vezes — kebab-case em vez de minúsculo, e herança não percorrida.
          #
          # A bateria é determinística: monta um repositório de mentira com espelho
          # sintético num diretório temporário e não lê o `frontend/` do repo.
          if ! bash scripts/testar-guards-ui.sh; then
            echo "::error title=Bateria dos guards de UI falhou::Um dos três guards não se comporta como o esperado. Veja quais casos falharam no log."
            exit 1
          fi
